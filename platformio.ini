
[platformio]
default_envs = waveshare_esp32s3_usb_msc

[env]
platform = espressif32@6.3.2
board = esp32-s3-r8-opi
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts = pre:tools/inject_build_tag.py
lib_deps =
  bodmer/JPEGDecoder@^2.0.0
  bitbank2/AnimatedGIF@^2.2.0
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DRSVP_ON_DEVICE_EPUB_CONVERSION=1
  -DBOARD_HAS_PSRAM
  ; Cap so a giant book like GEB doesn't OOM the device. 250k words covers most
  ; novels comfortably; longer books truncate with a warning rather than crash.
  -DRSVP_MAX_BOOK_WORDS=250000
  ; Enables [saver] / [flush] timing logs in the screensaver render path. Cheap
  ; enough to leave on for now while we tune; flip to 0 (or remove) before
  ; shipping a release build to drop the per-frame UART format cost.
  -DSCREENSAVER_PROFILING=1

[env:waveshare_esp32s3]
build_flags =
  ${env.build_flags}
  -DRSVP_USB_TRANSFER_ENABLED=0

[env:waveshare_esp32s3_usb_msc]
board_upload.wait_for_upload_port = true
; ARDUINO_USB_MODE=1 puts the chip in TinyUSB OTG mode so:
;   - Serial output goes through USB CDC (Serial.printf visible over USB)
;   - USBMSC works on the same TinyUSB stack (no peripheral switch dance)
;   - esptool can sync via the standard usb_reset path — no manual
;     BOOT+RESET dance needed on every flash.
; The previous setup (USB_MODE=0 + USBMSC bolted on) was fragile and made
; USB flashing this env impossible without physical buttons.
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MSC_ON_BOOT=0
  -DRSVP_USB_TRANSFER_ENABLED=1
; default_reset (DTR/RTS toggle) is correct for TinyUSB OTG firmware. Setting
; it explicitly so it's obvious — usb_reset is only for hardware USB Serial
; JTAG (USB_MODE=0), which we no longer use.
upload_flags =
  --before
  default_reset

